---

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Configure kernel networking for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
  loop:
    - name: net.bridge.bridge-nf-call-iptables
    - name: net.bridge.bridge-nf-call-ip6tables
    - name: net.ipv4.ip_forward

- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install required packages
  become: true
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present

- name: Create apt keyrings directory
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Kubernetes repository key
  become: true
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: '0644'

- name: Convert Kubernetes repository key to GPG format
  become: true
  ansible.builtin.command:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

- name: Add Kubernetes apt repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
    owner: root
    group: root
    mode: '0644'

- name: Install kubelet and kubeadm
  become: true
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
    state: present
    update_cache: true

- name: Hold Kubernetes packages
  become: true
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm

- name: Set kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    mode: '0644'

- name: Enable and start kubelet
  become: true
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
    state: started