---
- name: Download Flannel manifest
  ansible.builtin.get_url:
    url: https://github.com/flannel-io/flannel/releases/download/v0.28.10/kube-flannel.yml
    dest: /tmp/kube-flannel.yml
    mode: '0644'

- name: Set Flannel interface
  ansible.builtin.lineinfile:
    path: /tmp/kube-flannel.yml
    regexp: '^\s*- --iface='
    insertafter: '^\s*- --kube-subnet-mgr'
    line: '        - --iface={{ flannel_iface }}'

- name: Install Flannel
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/kube-flannel.yml
  become: false
  register: flannel_apply
  changed_when: >
    'created' in flannel_apply.stdout or
    'configured' in flannel_apply.stdout

- name: Download Local Path Storage manifest
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
    dest: /tmp/local-path-storage.yml
    mode: '0644'

- name: Install Local Path Storage
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/local-path-storage.yml
  become: false
  register: local_path_storage_apply
  changed_when: >
    'created' in local_path_storage_apply.stdout or
    'configured' in local_path_storage_apply.stdout

- name: Patch Storageclass local-path
  ansible.builtin.command:
    cmd: kubectl patch storageclass local-path -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  become: false
  register: storageclass_patch
  changed_when: "'no change' not in storageclass_patch.stdout"

- name: Download Helm Binary
  ansible.builtin.get_url:
    url: https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz
    dest: /tmp/helm-v4.3.2-linux-amd64.tar.gz
    mode: '0644'

- name: Extract Helm archive
  ansible.builtin.unarchive:
    src: /tmp/helm-v4.3.2-linux-amd64.tar.gz
    dest: /tmp
    remote_src: true
    creates: "/tmp/linux-amd64/helm"

- name: Install Helm binary
  ansible.builtin.copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"

- name: Prepare MetalLB installation
  ansible.builtin.shell:
    cmd: |
      kubectl get configmap kube-proxy -n kube-system -o yaml | 
      sed -e "s/strictARP: false/strictARP: true/" | 
      kubectl apply -f - -n kube-system
  register: kube_proxy_edit_result
  changed_when: "'configured' in kube_proxy_edit_result.stdout"
  become: false

- name: Download MetalLB manifest
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/metallb/metallb/v0.16.2/config/manifests/metallb-frr-k8s.yaml
    dest: /tmp/metallb-frr-k8s-v0.16.2.yaml
    mode: '0644'

- name: Install MetalLB
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/metallb-frr-k8s-v0.16.2.yaml
  become: false
  register: metallb_apply
  changed_when: >
    'created' in metallb_apply.stdout or
    'configured' in metallb_apply.stdout

- name: Copy MetalLB configuration
  ansible.builtin.copy:
    src: metallb-config.yaml
    dest: /tmp/metallb-config.yaml
    mode: "0644"

- name: Configure MetalLB address pool
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/metallb-config.yaml
  register: metallb_config
  changed_when: "'created' in metallb_config.stdout or 'configured' in metallb_config.stdout"
  become: false

- name: Install Gateway API CRDs
  ansible.builtin.command:
    cmd: >
      kubectl apply -f
      https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.7.0/standard-install.yaml
  register: gateway_api_crds
  changed_when: "'created' in gateway_api_crds.stdout or 'configured' in gateway_api_crds.stdout"
  become: false

- name: Wait for Gateway API CRDs
  ansible.builtin.command:
    cmd: kubectl get crd gateways.gateway.networking.k8s.io
  register: gateway_crd
  retries: 10
  delay: 3
  until: gateway_crd.rc == 0
  changed_when: false
  become: false

- name: Install Python dependencies
  ansible.builtin.apt:
    name:
      - python3-yaml
      - python3-kubernetes
    state: present
    update_cache: true

- name: Add Traefik Helm repository
  kubernetes.core.helm_repository:
    name: traefik
    repo_url: https://traefik.github.io/charts
    state: present
  notify: Update Helm repositories

- name: Install Traefik
  kubernetes.core.helm:
    name: traefik
    chart_ref: traefik/traefik
    chart_version: "42.4.0"
    release_namespace: traefik
    create_namespace: true
    state: present
    wait: true
    update_repo_cache: true
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      providers:
        kubernetesGateway:
          enabled: true
      gateway:
        listeners:
          web:
            namespacePolicy:
              from: All

- name: Add Jetstack Helm repository
  kubernetes.core.helm_repository:
    name: jetstack
    repo_url: https://charts.jetstack.io
    state: present

- name: Install Cert Manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: jetstack/cert-manager
    chart_version: "v1.21.3"
    release_namespace: cert-manager
    create_namespace: true
    state: present
    wait: true
    update_repo_cache: true
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      crds:
        enabled: true