---

- name: Download containerd release
  ansible.builtin.get_url:
    url: https://github.com/containerd/containerd/releases/download/v2.4.2/containerd-2.4.2-linux-amd64.tar.gz
    dest: /home/vagrant/containerd-2.4.2-linux-amd64.tar.gz
    owner: root
    group: root
    mode: '0644'

- name: Extract containerd binaries
  ansible.builtin.unarchive:
    src: /home/vagrant/containerd-2.4.2-linux-amd64.tar.gz
    dest: /usr/local
    remote_src: true

- name: Create systemd directory
  ansible.builtin.file:
    path: /usr/local/lib/systemd/system
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download containerd service file
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/containerd/containerd/refs/heads/release/2.4/containerd.service
    dest: /usr/local/lib/systemd/system/containerd.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart containerd

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Download runc release
  ansible.builtin.get_url:
    url: https://github.com/opencontainers/runc/releases/download/v1.5.3/runc.amd64
    dest: /usr/local/sbin/runc
    owner: root
    group: root
    mode: '0755'

- name: Create CNI binaries directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download cni release
  ansible.builtin.get_url:
    url: https://github.com/containernetworking/plugins/releases/download/v1.10.0/cni-plugins-linux-amd64-v1.10.0.tgz
    dest: /home/vagrant/cni-plugins-linux-amd64-v1.10.0.tgz
    owner: root
    group: root
    mode: '0644'

- name: Extract cni binaries
  ansible.builtin.unarchive:
    src: /home/vagrant/cni-plugins-linux-amd64-v1.10.0.tgz
    dest: /opt/cni/bin
    remote_src: true

- name: Create containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  ansible.builtin.command:
    cmd: containerd config default
  register: containerd_config
  changed_when: false

- name: Write containerd config
  ansible.builtin.copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'

- name: Enable SystemdCgroup
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '(^\s*SystemdCgroup\s*=\s*)false$'
    replace: '\1true'
  notify: Restart containerd

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    reload: true
